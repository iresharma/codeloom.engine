[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    lsp: spawns a real language server; skipped when the binary is absent
    integration: spawns real external processes (e.g. LSP server); excluded from default/CI run
    asyncio: mark a test as asyncio-based (handled by pytest-asyncio)
    judge: calls the real TypeSafe API; skipped when TYPESAFE_API_KEY is absent
# -n auto on a 12-core Mac spawned a worker per core; each imported
# tree-sitter + textual + the engine and held EngineSession HTTP clients
# until the run ended (or survived a Ctrl-C). Cap it.
addopts = -n logical --maxprocesses=4 --dist loadfile
